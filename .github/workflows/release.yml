name: Build & Release

on:
  push:
    branches: [main, "feature/rust"]
    paths-ignore:
      - appcast.xml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/rust'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the published appcast from main
        run: |
          git fetch origin main
          git show origin/main:appcast.xml > appcast.xml
      - name: Validate release version and Sparkle build number
        id: version
        run: python3 scripts/release.py prepare

  build-macos:
    needs: prepare-release
    if: needs.prepare-release.outputs.needed == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      SPARKLE_FRAMEWORK_PATH: ${{ github.workspace }}/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Install pinned Sparkle framework and signing tools
        run: bash scripts/setup-sparkle.sh
      - name: Check frontend
        run: |
          npm run lint
          npm test
          npm run format:check
      - name: Check Rust with release updater enabled
        env:
          DYLD_FRAMEWORK_PATH: ${{ env.SPARKLE_FRAMEWORK_PATH }}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features macos-updater
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --features macos-updater --all-targets -- -D warnings
      - name: Build universal macOS application and DMG
        run: npm run tauri build -- --target universal-apple-darwin --features macos-updater --config src-tauri/tauri.release.conf.json -- --locked
      - name: Verify bundle and sign update with the existing Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/release.py sign
      - name: Create draft release for this exact commit
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$VERSION" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json, os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$VERSION" --target "$RELEASE_COMMIT" --title "$VERSION" --draft --generate-notes
          fi
          gh release upload "$VERSION" "AndroidTools-$VERSION-macos.dmg" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json
          retention-days: 30

  publish-release:
    needs: [prepare-release, build-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use the release script from the tested commit
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p scripts
          git show "$RELEASE_COMMIT:scripts/release.py" > scripts/release.py
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
      - name: Generate appcast from the signed artifact
        run: python3 scripts/release.py feed
      - name: Publish download before advertising the update
        run: |
          gh release edit "$VERSION" --draft=false --latest
          gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fx "AndroidTools-$VERSION-macos.dmg"
      - name: Publish appcast at the existing URL
        run: |
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "chore(appcast): macOS $VERSION"
            git push origin HEAD:main
          fi
