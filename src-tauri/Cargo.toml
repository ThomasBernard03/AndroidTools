[package]
name = "android-tools"
version = "0.1.0"
description = "Android device tools"
edition = "2024"
rust-version = "1.90"

[lib]
name = "android_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apk-info = "=1.0.13"
roxmltree = "0.21"
tauri-plugin-dialog = "2"
adb_client = { version = "=3.2.3", default-features = false, features = ["usb"] }
rsa = "0.9"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }
rcgen = "0.14"
sha2 = "0.10"
