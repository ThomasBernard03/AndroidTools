[package]
name = "android-tools"
version = "0.1.0"
description = "Desktop tools for Android devices"
edition = "2024"
rust-version = "1.90"

[lib]
name = "android_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
rsadb = { version = "0.1.1", default-features = false, features = ["usb"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
unwrap_used = "warn"
